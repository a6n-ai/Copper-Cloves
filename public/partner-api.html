<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Partner API · The Studio by Copper + Cloves</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <style>body { margin: 0; background: #fafaf8; }</style>
</head>
<body>
  <div id="app"></div>
  <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference@1.72.1/dist/browser/standalone.js" integrity="sha384-U11tb2XnKvmwt8RlTvnwUnYgrN+ur4Xyh9htLhjajWNR/Oyl5AX5DEz00qRmlrmK" crossorigin="anonymous"></script>
  <script>
    Scalar.createApiReference("#app", {
      url: "/partner-api.json",
      // Same-origin calls need no CORS proxy; the default proxy.scalar.com would
      // see every partner's Bearer key.
      proxyUrl: "",
      telemetry: false,
      agent: { disabled: true },
      showDeveloperTools: "never",
      persistAuth: false,
      customCss: ".light-mode { --scalar-color-accent: #8f9779; --scalar-background-1: #fafaf8; }",
    });
  </script>
</body>
</html>
