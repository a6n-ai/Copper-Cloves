version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 20
        - npm ci --no-audit --no-fund
    build:
      commands:
        - npx prisma db push --accept-data-loss
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
