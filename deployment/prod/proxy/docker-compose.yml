# Public ingress. One Caddy fronts the app (auto-TLS via Let's Encrypt),
# reaching cc-web over the external `edge` network by container name.
# Create the network once on the box:  docker network create edge
services:
  caddy:
    image: caddy:2-alpine
    container_name: cc-caddy
    restart: unless-stopped
    env_file: .env.production # provides $ACME_EMAIL + $APP_DOMAIN to the Caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount the DIRECTORY, never the file. A single-file bind mount binds that
      # file's inode, and `git pull` REPLACES the file rather than editing it in
      # place — so a long-lived container would keep reading the original inode
      # and `caddy reload` would re-read a stale copy forever. Mounting the dir
      # makes /etc/caddy/Caddyfile resolve fresh on every open, so a reload picks
      # up edits with no restart. conf/ holds only the Caddyfile (the compose
      # file and .env.production stay outside it, unmounted).
      - ./conf:/etc/caddy:ro
      - caddy_data:/data # persists issued certs across restarts
      - caddy_config:/config
    networks:
      - edge

volumes:
  caddy_data:
  caddy_config:

networks:
  edge:
    external: true
