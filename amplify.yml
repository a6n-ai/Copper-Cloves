# AWS Amplify Hosting: Next.js SSR/API routes do not receive Console environment variables at runtime
# unless they are written into a file Next.js loads in production. See:
# https://docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
#
# In Amplify Console → Environment variables, define at least:
#   STUDIO_DATABASE_URL  (recommended) or DATABASE_URL — Postgres connection string for production
#   NEXTAUTH_SECRET      — random secret for credentials auth
#   NEXTAUTH_URL         — e.g. https://main.xxxxx.amplifyapp.com
#
# Optional one-time admin bootstrap (POST /api/setup/bootstrap-admin with header x-admin-setup-secret):
#   ADMIN_SETUP_SECRET   — long random string; remove after use
#   ADMIN_EMAIL, ADMIN_PASSWORD — admin login; remove ADMIN_PASSWORD after use
#
# Email (CRM + notifications): either Gmail SMTP or Resend (see .env EMAIL_* / RESEND_*)
#
# Do not commit secrets; this file only runs during Amplify build.

version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - rm -rf node_modules
        - npm ci --no-audit --no-fund
        - test -n "$STUDIO_DATABASE_URL" -o -n "$DATABASE_URL" || (echo "Missing STUDIO_DATABASE_URL or DATABASE_URL in Amplify environment variables" && exit 1)
        - npx prisma generate
        - node scripts/check-db-connection.mjs
    build:
      commands:
        - |
          echo "Preparing .env.production for Next.js SSR (DB + NextAuth)"
          node scripts/write-ssr-env.mjs
          npm run build
          # Amplify artifact is only `.next/`; copy env into it so runtime loadEnvConfig + pg see DB URL.
          if [ -f .env.production ]; then cp .env.production .next/.env.production; fi
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
